<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fuentes propias (src/styles/fonts.css): preload solo de las dos de la
         primera pantalla, el h1 (Playfair) y el resto del texto (DM Sans). -->
    <link rel="preload" href="/fonts/playfair-display-v40-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-sans-v17-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Solo claro: evita que Chrome aplique su modo oscuro automático -->
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#F2ECDF" />
    <!-- Sin indexar hasta que el dueño apruebe (también X-Robots-Tag en vercel.json) -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Librería el Sello · Útiles escolares, papelería y arte en Quilmes Centro</title>
    <meta name="description" content="Librería en Rivadavia 341, Quilmes Centro. Armá tu lista de útiles escolares, papelería o artículos de arte y mandala por WhatsApp: te la preparamos." />
    <!-- Las URLs absolutas (SITE_URL) y el JSON-LD salen de src/config.ts: plugin seo de vite.config.ts -->
    <link rel="canonical" href="%SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Librería el Sello" />
    <meta property="og:title" content="Librería el Sello · Útiles escolares, papelería y arte en Quilmes Centro" />
    <meta property="og:description" content="Librería en Rivadavia 341, Quilmes Centro. Armá tu lista de útiles escolares, papelería o artículos de arte y mandala por WhatsApp: te la preparamos." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Librería el Sello, útiles escolares, papelería y arte en Quilmes Centro" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Librería el Sello · Útiles escolares, papelería y arte en Quilmes Centro" />
    <meta name="twitter:description" content="Librería en Rivadavia 341, Quilmes Centro. Armá tu lista de útiles escolares, papelería o artículos de arte y mandala por WhatsApp: te la preparamos." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="Librería el Sello, útiles escolares, papelería y arte en Quilmes Centro" />

    <!--jsonld-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
